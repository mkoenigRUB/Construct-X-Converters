server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: construct-x-rdf-service
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
constructx:
  # Default: pinned 'ontologies' git submodule am Repository-Root (relativ
  # zum Modul-Workdir). In Docker ueberschreibt CONX_ONTOLOGY_ROOT das mit
  # dem gebackenen /app/ontologies.
  ontology-root: ${CONX_ONTOLOGY_ROOT:../ontologies}
  cors:
    allowed-origins: ${CONX_CORS_ALLOWED_ORIGINS:http://localhost:8080}
